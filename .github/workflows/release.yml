name: release

# Bump "version" in package.json on master -> Windows build -> GitHub Release vX.Y.Z.
# The installed app picks the release up via latest.yml (electron-updater).
on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Skip if this version is already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build and publish
        if: steps.ver.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
      - name: Release notes
        if: steps.ver.outputs.exists == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="${{ steps.ver.outputs.tag }}"
          F="release-notes/$T.md"
          if [ -f "$F" ]; then gh release edit "$T" --notes-file "$F" --title "Questbook ${T#v}"; fi
