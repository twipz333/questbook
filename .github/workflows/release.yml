name: release

# Push a tag like v1.2.0 (matching package.json version) -> Windows build -> GitHub Release.
# The installed app picks the release up via latest.yml (electron-updater).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$V"; exit 1; }
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$F" ]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$F" --title "Questbook ${GITHUB_REF_NAME#v}"; fi
