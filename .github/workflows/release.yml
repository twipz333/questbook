name: release

# Bump "version" in package.json on master -> Windows build -> GitHub Release vX.Y.Z.
# The installed app picks the release up via latest.yml (electron-updater).
on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Skip if this version is already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          ASSETS=$(gh release view "v$V" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || echo "__none__")
          if [ "$ASSETS" = "__none__" ]; then echo "exists=0" >> "$GITHUB_OUTPUT"
          elif echo "$ASSETS" | grep -q "latest.yml" && echo "$ASSETS" | grep -q "Setup-$V.exe,"; then echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$V is incomplete ($ASSETS) - recreating"
            gh release delete "v$V" --cleanup-tag -y
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer
        if: steps.ver.outputs.exists == '0'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 --publish never 2>&1 | tee build.log || {
            tail -n 25 build.log | tr '\r' ' ' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="${{ steps.ver.outputs.tag }}"
          V="${T#v}"
          NOTES="release-notes/$T.md"
          [ -f "$NOTES" ] || echo "Questbook $V" > "$NOTES"
          gh release create "$T" "dist/Questbook-Setup-$V.exe" "dist/Questbook-Setup-$V.exe.blockmap" dist/latest.yml \
            --target "$GITHUB_SHA" --title "Questbook $V" --notes-file "$NOTES" 2>&1 | tee pub.log || {
            tail -n 10 pub.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
